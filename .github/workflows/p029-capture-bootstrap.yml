name: P0.29 capture identity gate
on:
  push:
    branches: [work/phase-d-aim-reconstruction]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Lua 5.3 toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Apply capture-identity correction
        run: python3 tools/patch_p029_capture_identity.py
      - name: Focused capture regressions
        run: |
          lua5.3 tests/p029_runtime_helpers.lua .
          lua5.3 tests/mutation_runtime.lua .
      - name: Regenerate and validate without ownership movement
        run: |
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          python3 - <<'PY'
          import json
          d=json.load(open('FULL_PAYLOAD_PROTOTYPE_INDEX.json'))
          assert '0.29.72' in d['ownership_groups']['payload_owned']
          assert '0.29.72.0' in d['ownership_groups']['payload_owned']
          PY
          git add -A
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          git diff --exit-code
      - name: Verify deterministic custom rebuild
        run: |
          sha256sum spectra_wrapper_phase_d.custom.luac > /tmp/p029-capture.sha
          python3 tools/build_phase_d.py
          sha256sum --check /tmp/p029-capture.sha
      - name: Commit validated capture checkpoint
        run: |
          rm tools/patch_p029_capture_identity.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'freeze P0.29 helper capture identity'
          git push origin HEAD:work/phase-d-aim-reconstruction
