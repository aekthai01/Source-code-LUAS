name: Phase D expiration bootstrap
on:
  push:
    branches: [work/phase-d-aim-reconstruction]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/phase-d-aim-reconstruction
          fetch-depth: 0
      - name: Install Lua 5.3 toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Apply source reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          generator=Path('tools/full_payload_forensics.py')
          text=generator.read_text(encoding='utf-8')
          old='## P0.0..P0.15 source-only preparation'
          assert text.count(old)==1
          generator.write_text(text.replace(old,'## P0.0..P0.18 source-only preparation'),encoding='utf-8')
          patcher=Path('tools/apply_expiration_checkpoint.py')
          lines=patcher.read_text(encoding='utf-8').splitlines()
          assert lines[217].strip()=='replace_once('
          assert 'P0.0..P0.15 source-only preparation' in lines[219]
          del lines[217:222]
          patcher.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 tools/apply_expiration_checkpoint.py
          lua5.3 tests/product_expiration.lua "$PWD"
          lua5.3 tests/product_source_only.lua "$PWD"
          lua5.3 tests/product_module_bridge.lua "$PWD"
          git diff --check
      - name: Regenerate evidence
        run: |
          python3 tools/root_capture_forensics.py >/tmp/root1.txt
          python3 tools/aim_forensics.py >/tmp/aim1.txt
          python3 tools/full_payload_forensics.py >/tmp/full1.txt
          sha256sum ROOT_CAPTURE_MAP.json ROOT_CAPTURE_MAP.md AIM_PROTOTYPE_INDEX.json FULL_PAYLOAD_PROTOTYPE_INDEX.json FULL_PAYLOAD_RECONSTRUCTION_MAP.md RECONSTRUCTION_COVERAGE.md > /tmp/generated.sha
          python3 tools/root_capture_forensics.py >/tmp/root2.txt
          python3 tools/aim_forensics.py >/tmp/aim2.txt
          python3 tools/full_payload_forensics.py >/tmp/full2.txt
          sha256sum --check /tmp/generated.sha
      - name: Validate ownership and build
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('FULL_PAYLOAD_PROTOTYPE_INDEX.json'))
          c=d['coverage']
          assert c['unknown']==0 and c['partially_reconstructed']==0
          assert c['root_methods_source_owned']==19
          for name in ('_CheckSafeBoxExpiredStatus','_CheckKeyChainExpiredStatus','_CheckPropExpiredStatus'):
              item=d['root_public_methods'][name]
              assert item['current_ownership']=='source_owned'
              assert item['source_only_dependency'] is True
          assert d['root_public_methods']['CheckPlayerBodyItemsByList']['current_ownership']=='payload_owned'
          PY
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          sha256sum spectra_wrapper_phase_d.custom.luac > /tmp/custom.sha
          python3 tools/build_phase_d.py
          sha256sum --check /tmp/custom.sha
          git diff --check
      - name: Commit validated checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-d-expiration-bootstrap.yml tools/apply_expiration_checkpoint.py
          git add -A
          git commit -m 'reconstruct source-only P0.16 P0.17 P0.18 expiration checks'
          git push origin HEAD:work/phase-d-aim-reconstruction
