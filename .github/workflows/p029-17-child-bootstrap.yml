name: P0.29.17 child ownership gate
on:
  push:
    branches: [work/phase-d-aim-reconstruction]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Install Lua 5.3 toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Apply bounded child proof
        run: python3 tools/patch_p029_17_child.py
      - name: Focused mutation regressions
        run: |
          lua5.3 tests/p029_mutation_primitives.lua .
          lua5.3 tests/mutation_runtime.lua .
      - name: Regenerate and validate
        run: |
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          python3 - <<'PY'
          import json
          d=json.load(open('FULL_PAYLOAD_PROTOTYPE_INDEX.json'))
          assert '0.29.17.0' in d['ownership_groups']['source_owned']
          assert d['source_files']['0.29.17.0']=='src/spectra/mutation_runtime.lua'
          assert d['coverage']['classified']==296 and d['coverage']['unknown']==0
          assert d['coverage']['partially_reconstructed']==0
          PY
          git add -A
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          git diff --exit-code
      - name: Deterministic rebuild
        run: |
          sha256sum spectra_wrapper_phase_d.custom.luac > /tmp/p17-child.sha
          python3 tools/build_phase_d.py
          sha256sum --check /tmp/p17-child.sha
      - name: Materialize validated checkpoint
        run: |
          rm tools/patch_p029_17_child.py
          git add -A
          git restore --source=HEAD --staged --worktree .github/workflows/phase-d.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source-own P0.29.17 restore assignment child'
          git fetch origin work/phase-d-aim-reconstruction
          git rebase origin/work/phase-d-aim-reconstruction
          git push origin HEAD:work/phase-d-aim-reconstruction
