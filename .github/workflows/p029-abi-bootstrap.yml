name: P0.29 ABI helper bootstrap
on:
  push:
    branches: [work/phase-d-aim-reconstruction]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/phase-d-aim-reconstruction
          fetch-depth: 0
      - name: Install Lua 5.3 toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Focused ABI regression
        run: |
          lua5.3 tests/aim_abi.lua "$PWD"
          git diff --check
      - name: Regenerate validate and rebuild twice
        run: |
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          sha256sum \
            ROOT_CAPTURE_MAP.json ROOT_CAPTURE_MAP.md \
            AIM_PROTOTYPE_INDEX.json P029_ABI_HELPER_MAP.json P029_ABI_HELPER_MAP.md \
            FULL_PAYLOAD_PROTOTYPE_INDEX.json FULL_PAYLOAD_RECONSTRUCTION_MAP.md RECONSTRUCTION_COVERAGE.md \
            validation_phase_d.json spectra_wrapper_phase_d_source.lua \
            spectra_wrapper_phase_d.standard.luac spectra_wrapper_phase_d.custom.luac \
            > /tmp/p029-abi-generated.sha
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          sha256sum --check /tmp/p029-abi-generated.sha
          git diff --check
          python3 - <<'PY'
          import json
          evidence=json.load(open('P029_ABI_HELPER_MAP.json'))
          inventory=json.load(open('FULL_PAYLOAD_PROTOTYPE_INDEX.json'))
          validation=json.load(open('validation_phase_d.json'))
          migrated={'0.29.2','0.29.2.0','0.29.3','0.29.4','0.29.12'}
          assert migrated <= set(inventory['ownership_groups']['source_owned'])
          assert not (migrated & set(inventory['ownership_groups']['payload_owned']))
          assert inventory['coverage']['source_owned'] == len(inventory['ownership_groups']['source_owned'])
          assert inventory['coverage']['payload_owned'] == len(inventory['ownership_groups']['payload_owned'])
          assert inventory['coverage']['partially_reconstructed'] == 0
          assert inventory['coverage']['unknown'] == 0
          assert inventory['coverage']['root_methods_source_owned'] == 29
          assert evidence['_meta']['payload_closure_rebinding'] is False
          assert validation['checks']['p029_abi_helper_map'] == 'passed'
          assert validation['checks']['p029_abi_exact_return_shapes'] == 'passed'
          assert validation['checks']['game_runtime_test'] is False
          assert validation['baseline']['sha256'] == '35ee381760ea24dcfebfac44433f8fe3078b4b34df79b165968bfeb87c874536'
          assert validation['embedded_payload']['sha256'] == 'a0438b2eb2ecdec664dc25a6093766b9d79ab2dc6bc00536d59ff901798f6263'
          PY
      - name: Commit validated bounded checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/p029-abi-bootstrap.yml
          git add -A
          git diff --cached --check
          git commit -m 'reconstruct source-only P0.29 ABI helpers'
          git push origin HEAD:work/phase-d-aim-reconstruction
