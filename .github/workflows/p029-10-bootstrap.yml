name: P0.29.10 exact helper gate
on:
  push:
    branches: [work/phase-d-aim-reconstruction]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Lua 5.3 toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Apply bounded P0.29.10 patch
        run: python3 tools/patch_p029_10_checkpoint.py
      - name: Focused P0.29.10 regression
        run: lua5.3 tests/mutation_runtime.lua .
      - name: Regenerate and validate ownership
        run: |
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          python3 - <<'PY'
          import json
          d=json.load(open('FULL_PAYLOAD_PROTOTYPE_INDEX.json'))
          assert '0.29.10' in d['ownership_groups']['source_owned']
          assert d['source_files']['0.29.10']=='src/spectra/mutation_runtime.lua'
          assert d['coverage']['classified']==296
          assert d['coverage']['unknown']==0
          assert d['coverage']['partially_reconstructed']==0
          PY
          git add -A
          python3 tools/root_capture_forensics.py
          python3 tools/aim_forensics.py
          python3 tools/full_payload_forensics.py
          python3 tools/build_phase_d.py
          python3 tools/validate_phase_d.py
          git diff --exit-code
      - name: Verify deterministic custom rebuild
        run: |
          sha256sum spectra_wrapper_phase_d.custom.luac > /tmp/p029-10.sha
          python3 tools/build_phase_d.py
          sha256sum --check /tmp/p029-10.sha
      - name: Commit validated checkpoint
        run: |
          git reset
          git add src tests tools/aim_forensics.py tools/full_payload_forensics.py tools/validate_phase_d.py \
            AIM_PROTOTYPE_INDEX.json P029_ABI_HELPER_MAP.json P029_ABI_HELPER_MAP.md \
            P029_RUNTIME_HELPER_MAP.json P029_RUNTIME_HELPER_MAP.md P029_AIM_RUNTIME_MAP.json P029_AIM_RUNTIME_MAP.md \
            FULL_PAYLOAD_PROTOTYPE_INDEX.json FULL_PAYLOAD_RECONSTRUCTION_MAP.md RECONSTRUCTION_COVERAGE.md \
            ROOT_CAPTURE_MAP.json ROOT_CAPTURE_MAP.md validation_phase_d.json \
            spectra_wrapper_phase_d_source.lua spectra_wrapper_phase_d.standard.luac spectra_wrapper_phase_d.custom.luac
          git restore --staged tools/patch_p029_10_checkpoint.py || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'source-own P0.29.10 normalize identifier ABI'
          git push origin HEAD:work/phase-d-aim-reconstruction
